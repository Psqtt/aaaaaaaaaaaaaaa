<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="nucleus-grad-dark" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
  </defs>
  <!-- Orbit 1 (0 deg) -->
  <ellipse cx="256" cy="256" rx="212" ry="76" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Orbit 2 (60 deg) -->
  <ellipse cx="256" cy="256" rx="212" ry="76" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="rotate(60 256 256)" />
  <!-- Orbit 3 (120 deg) -->
  <ellipse cx="256" cy="256" rx="212" ry="76" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="rotate(120 256 256)" />
  <!-- Central Nucleus -->
  <circle cx="256" cy="256" r="42" fill="url(#nucleus-grad-dark)" />
  <!-- Orbital Electrons / Particles -->
  <circle cx="468" cy="256" r="15" fill="#ffffff" />
  <circle cx="150" cy="73" r="15" fill="#ffffff" />
  <circle cx="362" cy="439" r="15" fill="#ffffff" />
</svg>
